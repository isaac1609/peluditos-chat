<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluditos Spa Chat ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #120c1d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-gradient: linear-gradient(135deg, #ff8a65 0%, #e91e63 100%);
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --user-msg: rgba(255, 138, 101, 0.2);
            --bot-msg: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body { 
            background-color: var(--bg-dark); 
            background-image: radial-gradient(circle at top right, #2a1b3d, transparent), radial-gradient(circle at bottom left, #1a0f2e, transparent);
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            color: var(--text-white);
        }

        header { 
            background: rgba(18, 12, 29, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { 
            font-size: 1.2rem; 
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .btn-whatsapp {
            background: var(--accent-gradient);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .message { 
            max-width: 85%; 
            padding: 12px 18px; 
            border-radius: 20px; 
            line-height: 1.5; 
            font-size: 0.95rem; 
            position: relative;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: pre-wrap;
        }

        .user { 
            align-self: flex-end; 
            background: var(--user-msg); 
            border-color: rgba(255, 138, 101, 0.3);
            border-bottom-right-radius: 4px; 
        }

        .bot { 
            align-self: flex-start; 
            background: var(--bot-msg); 
            border-bottom-left-radius: 4px; 
        }

        #quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 20px 15px 20px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            transform: translateY(-2px);
        }

        #input-area { 
            background: rgba(18, 12, 29, 0.9);
            padding: 20px; 
            display: flex; 
            gap: 12px; 
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input { 
            flex: 1; 
            padding: 14px 20px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; 
            outline: none; 
            font-size: 1rem; 
            color: white;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #ff8a65;
        }

        button[type="submit"] { 
            background: var(--accent-gradient); 
            color: white; 
            border: none; 
            padding: 0 25px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: 600;
            transition: transform 0.2s;
        }

        button[type="submit"]:active {
            transform: scale(0.95);
        }

        .typing { 
            font-style: italic; 
            color: var(--text-gray); 
            font-size: 0.8rem; 
            margin-left: 25px; 
            margin-bottom: 10px;
            display: none; 
        }

        /* Scrollbar styling */
        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Peluditos SPA ✨</h1>
        <a href="https://wa.me/56940304426" class="btn-whatsapp" target="_blank">WhatsApp</a>
    </header>
    
    <div id="chat-container">
        <div class="message bot">Hola, gracias por comunicarte con Peluditos SPA, ¿en qué te puedo ayudar hoy? 🐾✨</div>
    </div>

    <div id="typing-indicator" class="typing">Peluditos Spa está escribiendo...</div>

    <div id="quick-replies">
        <button class="quick-btn" onclick="sendQuickReply('Precio del baño 💰')">Precio del baño 💰</button>
        <button class="quick-btn" onclick="sendQuickReply('Contacto 📲')">Contacto 📲</button>
        <button class="quick-btn" onclick="sendQuickReply('Ubicación 📍')">Ubicación 📍</button>
        <button class="quick-btn" onclick="sendQuickReply('Horario de atención 🕒')">Horario de atención 🕒</button>
    </div>

    <form id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
        <button type="submit">Enviar</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-area');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const WEBHOOK_URL = 'https://vps-5840516-x.dattaweb.com/webhook/Mateo';

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage(message) {
            addMessage(message, 'user');
            typingIndicator.style.display = 'block';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        source: 'web_chat',
                        timestamp: new Date().toISOString()
                    })
                });
                
                const text = await response.text();
                let reply = "¡Gracias por tu mensaje! Pronto te responderemos. 🐾";
                
                try {
                    const data = JSON.parse(text);
                    reply = data.output || data.message || data.reply || text;
                } catch(e) {
                    if (text) reply = text;
                }

                typingIndicator.style.display = 'none';
                addMessage(reply, 'bot');
            } catch (error) {
                console.error('Error:', error);
                typingIndicator.style.display = 'none';
                addMessage('Lo siento, tuve un problema al conectar con mi sistema. Por favor, contáctanos por WhatsApp al +56940304426. 🐾', 'bot');
            }
        }

        function sendQuickReply(text) {
            sendMessage(text);
        }

        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;
            userInput.value = '';
            sendMessage(message);
        });
    </script>
</body>
</html>
