<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateos - Asistente de Peluditos Spa</title>
    <style>
        :root {
            --primary-color: #f07b72;
            --bg-light: #f5f5f5;
            --text-dark: #333;
            --text-muted: #888;
            --border-color: #eee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 380px;
            height: 600px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .chat-header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: white;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
        }
        .bot-message {
            background-color: #f0f0f0;
            color: var(--text-dark);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }
        .user-message {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
            margin-top: 5px;
        }
        .typing-indicator {
            font-style: italic;
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 20px 10px;
            display: none;
        }
        .quick-replies-container {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quick-replies {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .quick-reply {
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .quick-reply:hover {
            background-color: var(--primary-color);
            color: white;
        }
        .chat-input-container {
            padding: 10px 20px 20px;
        }
        .chat-input {
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        .chat-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-dark);
        }
        .chat-input input::placeholder {
            color: #ccc;
        }
        .footer {
            font-size: 11px;
            text-align: center;
            padding-bottom: 15px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Mateos</h2>
            <p>Asistente de Peluditos Spa</p>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                ¡Hola! Soy Mateos, el asistente de <strong>Peluditos Spa</strong>. Estoy aquí para ayudarte con precios, disponibilidad, horarios e información del negocio. ¿En qué te puedo ayudar hoy?
            </div>
        </div>
        <div id="typing" class="typing-indicator">Mateos está escribiendo...</div>
        <div class="quick-replies-container">
            <div class="quick-replies">
                <div class="quick-reply" onclick="sendMessage('Precios')">Precios</div>
                <div class="quick-reply" onclick="sendMessage('Disponibilidad')">Disponibilidad</div>
                <div class="quick-reply" onclick="sendMessage('Horarios')">Horarios</div>
                <div class="quick-reply" onclick="sendMessage('Info')">Info</div>
            </div>
        </div>
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." onkeypress="handleKeyPress(event)">
            </div>
        </div>
        <div class="footer">
            Powered by Peluditos Spa
        </div>
    </div>

    <script>
        const N8N_WEBHOOK_URL = 'https://isaclienan123.app.n8n.cloud/webhook/Mateo';

        async function sendMessage(text) {
            if (!text.trim()) return;
            
            const chatMessages = document.getElementById('chat-messages');
            const typingIndicator = document.getElementById('typing');
            
            // Mostrar mensaje del usuario
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatMessages.appendChild(userDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mostrar indicador de escritura
            typingIndicator.style.display = 'block';

            try {
                // Enviar al webhook de n8n
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: text,
                        timestamp: new Date().toISOString()
                    })
                });

                // Ocultar indicador de escritura
                typingIndicator.style.display = 'none';

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const data = await response.json();
                console.log('Respuesta de n8n:', data);
                
                // Mostrar respuesta de n8n - Manejo flexible de formatos
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                let botText = "";
                if (Array.isArray(data)) {
                    // Si n8n devuelve un array, tomamos el primer elemento
                    const firstItem = data[0];
                    botText = firstItem.output || firstItem.response || firstItem.message || firstItem.text || JSON.stringify(firstItem);
                } else {
                    // Si es un objeto directo
                    botText = data.output || data.response || data.message || data.text || (typeof data === 'string' ? data : JSON.stringify(data));
                }

                botDiv.textContent = botText || "Mateos recibió tu mensaje pero no devolvió una respuesta clara.";
                
                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                console.error('Error al conectar con n8n:', error);
                typingIndicator.style.display = 'none';
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message bot-message';
                errorDiv.textContent = "Hubo un error al conectar con Mateos. Por favor, verifica que el flujo de n8n esté activo y con CORS permitido.";
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('user-input');
                if (input.value.trim() !== '') {
                    sendMessage(input.value);
                    input.value = '';
                }
            }
        }
    </script>
</body>
</html>
